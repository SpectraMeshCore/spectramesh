name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format, lint and docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable --no-self-update && rustup default stable
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo doc --workspace --no-deps --locked

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
      # The three-daemon test runs in an unprivileged user namespace, which
      # Ubuntu 24.04 blocks by default through AppArmor.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Three daemons over virtual Ethernet
        run: cargo test -p spectramesh-wrt --locked -- --ignored

  no-std:
    name: Core without std
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable --no-self-update && rustup default stable
      - run: rustup target add thumbv7em-none-eabihf riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p spectramesh-core --locked --target thumbv7em-none-eabihf
      - run: cargo build -p spectramesh-core --locked --target riscv32imac-unknown-none-elf

  msrv:
    name: Minimum Rust version (1.85)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.85 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +1.85 check --workspace --all-targets --locked
        env:
          RUSTFLAGS: ""

  esp:
    name: ESP32 firmware
    runs-on: ubuntu-24.04
    env:
      # A RUSTFLAGS variable would replace the flags in .cargo/config.toml.
      RUSTFLAGS: ""
    defaults:
      run:
        working-directory: crates/spectramesh-esp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml adds the RISC-V target and rust-src on first use.
      - run: rustup update stable --no-self-update && rustup default stable
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/spectramesh-esp
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      # Built without a mesh key, so this firmware won't start. Each mesh
      # builds its own, with SPECTRAMESH_MESH_KEY set.
      - run: cargo build --release --locked
