name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format, lint and docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable --no-self-update && rustup default stable
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo doc --workspace --no-deps --locked

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
      # The three-daemon test runs in an unprivileged user namespace, which
      # Ubuntu 24.04 blocks by default through AppArmor.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Three daemons over virtual Ethernet
        run: cargo test -p spectramesh-wrt --locked -- --ignored

  no-std:
    name: Core and radio driver without std
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable --no-self-update && rustup default stable
      - run: rustup target add thumbv7em-none-eabihf riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p spectramesh-core -p spectramesh-sx126x --locked --target thumbv7em-none-eabihf
      - run: cargo build -p spectramesh-core -p spectramesh-sx126x --locked --target riscv32imac-unknown-none-elf

  msrv:
    name: Minimum Rust version (1.85)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.85 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +1.85 check --workspace --all-targets --locked
        env:
          RUSTFLAGS: ""

  openwrt:
    name: OpenWRT daemon (ramips/mt7621)
    runs-on: ubuntu-24.04
    env:
      SDK_URL: https://downloads.openwrt.org/releases/24.10.1/targets/ramips/mt7621
      SDK: openwrt-sdk-24.10.1-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64
      # MIPS is a tier 3 Rust target, so its standard library is built from
      # source, which needs nightly.
      RUST_NIGHTLY: nightly-2026-10-01
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rust-src --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: The SDK's C toolchain
        run: |
          mkdir -p sdk && cd sdk
          curl -sSfLO "$SDK_URL/$SDK.tar.zst"
          curl -sSfL "$SDK_URL/sha256sums" | grep " \*$SDK.tar.zst$" | sha256sum -c -
          tar --zstd -xf "$SDK.tar.zst" --wildcards "$SDK/staging_dir/toolchain-*" "$SDK/staging_dir/host/lib"
          rm "$SDK.tar.zst"
      - run: crates/spectramesh-wrt/scripts/cross-build.sh "sdk/$SDK"
      - run: |
          mkdir -p openwrt
          cp target/openwrt/spectrameshd-mipsel_24kc openwrt/spectrameshd
          cp crates/spectramesh-wrt/openwrt/files/spectramesh.init openwrt/
          cp crates/spectramesh-wrt/openwrt/files/spectramesh.config openwrt/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwrt-ramips-mt7621
          path: openwrt

  esp:
    name: ESP32 firmware
    runs-on: ubuntu-24.04
    env:
      # A RUSTFLAGS variable would replace the flags in .cargo/config.toml.
      RUSTFLAGS: ""
    defaults:
      run:
        working-directory: crates/spectramesh-esp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml adds the RISC-V target and rust-src on first use.
      - run: rustup update stable --no-self-update && rustup default stable
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/spectramesh-esp
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo clippy --locked --features xiao-esp32c6 -- -D warnings
      # Images hold no keys (boards get them with spectrameshd --provision),
      # so they're kept as an artifact, for any mesh.
      - run: cargo build --release --locked
      - run: |
          mkdir -p images
          cp target/riscv32imac-unknown-none-elf/release/spectramesh-esp images/spectramesh-esp-esp32c6
          cp target/riscv32imac-unknown-none-elf/release/spectramesh-modem images/spectramesh-modem-esp32c6
      - run: cargo build --release --locked --features xiao-esp32c6
      - run: |
          cp target/riscv32imac-unknown-none-elf/release/spectramesh-esp images/spectramesh-esp-xiao-esp32c6
          cp target/riscv32imac-unknown-none-elf/release/spectramesh-modem images/spectramesh-modem-xiao-esp32c6
          cp partitions.csv images/
      - run: cargo clippy --locked --no-default-features --features ieee802154,xiao-esp32c6 -- -D warnings
      - run: cargo build --release --locked --no-default-features --features ieee802154,xiao-esp32c6
      - run: |
          cp target/riscv32imac-unknown-none-elf/release/spectramesh-esp images/spectramesh-esp-802154-xiao-esp32c6
          cp target/riscv32imac-unknown-none-elf/release/spectramesh-modem images/spectramesh-modem-802154-xiao-esp32c6
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: crates/spectramesh-esp/images
