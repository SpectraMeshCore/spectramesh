name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC: longer runs than on every push.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: "600"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [frame, router, modem, key_text, reassembly, settings, daemon]
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal --no-self-update && rustup default nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz
        env:
          # 30 seconds on pushes and pull requests; 10 minutes weekly or as asked.
          SECONDS_EACH: ${{ github.event_name == 'schedule' && '600' || github.event.inputs.seconds || '30' }}
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time="$SECONDS_EACH"
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-crash
          path: fuzz/artifacts/${{ matrix.target }}
