[workspace]
resolver = "3"
members = ["crates/spectramesh-core"]
# Firmware builds for a microcontroller target with its own settings, so it is built
# from its own directory rather than as part of the workspace.
exclude = ["crates/spectramesh-esp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SpectraMeshCore/spectramesh"
homepage = "https://github.com/SpectraMeshCore"
