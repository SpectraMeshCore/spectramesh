[package]
name = "spectramesh-esp"
description = "SpectraMesh firmware for ESP32 boards"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SpectraMeshCore/spectramesh"
publish = false

[features]
default = ["espnow"]
# Seeed XIAO ESP32-C6: power its antenna switch and use the built-in antenna.
xiao-esp32c6 = []
# The built-in radio's hue: ESP-NOW over Wi-Fi, or 802.15.4. esp-radio can't
# build both into one image, so choose one; for 802.15.4, build with
# `--no-default-features --features ieee802154`.
espnow = ["esp-radio/esp-now", "esp-radio/wifi"]
ieee802154 = ["dep:ieee802154", "esp-radio/ieee802154"]

[[bin]]
name = "spectramesh-esp"
path = "./src/bin/main.rs"
test = false
bench = false

[[bin]]
name = "spectramesh-modem"
path = "./src/bin/modem.rs"
test = false
bench = false

[dependencies]
spectramesh-core = { path = "../spectramesh-core" }
spectramesh-sx126x = { path = "../spectramesh-sx126x" }

esp-hal = { version = "~1.2.2", features = ["esp32c6", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32c6", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp-alloc", "esp32c6", "log-04", "unstable"] }
# 802.15.4 frame types; the version esp-radio uses.
ieee802154 = { version = "0.6.1", optional = true }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6", "log-04"] }
esp-alloc = { version = "0.11.0", features = ["esp32c6"] }
# custom-halt: restart after a panic (see reset.rs) instead of hanging.
esp-backtrace = { version = "0.20.0", features = ["custom-halt", "esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32c6", "log-04"] }

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.0", features = ["log"] }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"
log = "0.4.27"

[profile.dev]
# The default debug profile is too slow and too big for microcontrollers.
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
